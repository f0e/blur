name: Build

on:
  push:
    paths-ignore:
      - "**.md"
      - LICENSE
      - .github/ISSUE_TEMPLATE/**
      - .github/FUNDING.yml
      - .github/dependabot.yml

# cancel superseded runs, but never a tag build mid-release
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  MPV_VERSION: "20260118-git-468d34c"
  MPV_SHA256: "0a538daa4fb6e6550ead2c345165ebc4696822dcb648ef9b80e9f5185a9e63e6"

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # generous enough for a cold vcpkg cache (angle builds from source)
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        build-type: [Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # # ── ccache ────────────────────────────────────────────────────────────
      # - name: Install ccache (Linux)
      #   if: runner.os == 'Linux'
      #   run: sudo apt-get install -y ccache

      # - name: Install ccache (macOS)
      #   if: runner.os == 'macOS'
      #   run: brew install ccache

      # - name: Install ccache (Windows)
      #   if: runner.os == 'Windows'
      #   run: choco install ccache --no-progress

      # - name: Cache ccache
      #   uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      #   with:
      #     path: |
      #       ~/.ccache
      #       ~/AppData/Local/ccache
      #     key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.build-type }}-${{ github.sha }}
      #     restore-keys: |
      #       ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.build-type }}-

      # - name: Configure ccache
      #   run: |
      #     ccache --set-config=max_size=500M
      #     ccache --set-config=compression=true
      #     ccache -z  # zero stats so we can see hit rate in logs

      # ── Linux setup ───────────────────────────────────────────────────────
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            mesa-common-dev \
            libncurses6 \
            libfontconfig1-dev \
            autoconf autoconf-archive automake libtool pkg-config libltdl-dev \
            libnotify-dev \
            libmpv-dev \
            ninja-build \
            gperf \
            patchelf

      # ── Project dependencies ──────────────────────────────────────────────
      - name: Cache build dependencies (macOS)
        id: deps-cache-macos
        if: runner.os == 'macOS'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ci/out
          key: deps-macos-${{ runner.arch }}-${{ hashFiles('ci/build-dependencies-macos.sh') }}

      - name: Cache build dependencies (Linux)
        id: deps-cache-linux
        if: runner.os == 'Linux'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ci/out
          key: deps-linux-${{ runner.arch }}-${{ hashFiles('ci/build-dependencies-linux.sh') }}

      - name: Cache build dependencies (Windows)
        id: deps-cache-windows
        if: runner.os == 'Windows'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ci/out
          key: deps-windows-${{ runner.arch }}-${{ hashFiles('ci/build-dependencies-windows.ps1') }}

      - name: Install Homebrew packages (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg libass zimg imagemagick autoconf automake libtool gcc ffmpeg meson xxhash vapoursynth fftw dylibbundler vulkan-loader molten-vk mpv

      - name: Collect dependencies (macOS)
        if: runner.os == 'macOS' && steps.deps-cache-macos.outputs.cache-hit != 'true'
        run: |
          cd ci
          bash build-dependencies-macos.sh

      - name: Collect dependencies (Windows)
        if: runner.os == 'Windows' && steps.deps-cache-windows.outputs.cache-hit != 'true'
        run: |
          cd ci
          pwsh build-dependencies-windows.ps1

      - name: Cache libmpv (Windows)
        id: libmpv-cache
        if: runner.os == 'Windows'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: mpv
          key: libmpv-${{ runner.os }}-${{ env.MPV_VERSION }}-${{ env.MPV_SHA256 }}

      - name: Download libmpv (Windows)
        if: runner.os == 'Windows' && steps.libmpv-cache.outputs.cache-hit != 'true'
        run: |
          curl -L https://sourceforge.net/projects/mpv-player-windows/files/libmpv/mpv-dev-x86_64-v3-${{ env.MPV_VERSION }}.7z/download > mpv.7z
          echo "${{ env.MPV_SHA256 }}  mpv.7z" | sha256sum -c
          7z x mpv.7z
          mkdir mpv
          mv include mpv
          gendef libmpv-2.dll
          mv libmpv-2.dll mpv/libmpv-2.dll
          mv libmpv-2.def mpv.def
          mv mpv.def libmpv.dll.a mpv/

      - name: Collect dependencies (Linux)
        if: runner.os == 'Linux' && steps.deps-cache-linux.outputs.cache-hit != 'true'
        run: |
          cd ci
          bash build-dependencies-linux.sh

      # ── vcpkg ─────────────────────────────────────────────────────────────
      - name: Set up vcpkg
        run: |
          # check out the same commit as the manifest's baseline so the cache key stays stable
          baseline="$(jq -r '."vcpkg-configuration"."default-registry".baseline' vcpkg.json)"
          git init vcpkg
          git -C vcpkg fetch --depth 1 https://github.com/microsoft/vcpkg.git "$baseline"
          git -C vcpkg checkout FETCH_HEAD
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Cache vcpkg packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            out/build/*/vcpkg_installed/
            vcpkg/downloads/
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.build-type }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*.cmake') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.build-type }}-

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Determine CMake Preset
        id: select-preset
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            prefix="win"
          elif [ "${{ runner.os }}" == "Linux" ]; then
            prefix="linux"
          elif [ "${{ runner.os }}" == "macOS" ]; then
            prefix="mac"
          fi
          preset="${prefix}-$(echo "${{ matrix.build-type }}" | tr '[:upper:]' '[:lower:]')"
          echo "preset=$preset" >> "$GITHUB_OUTPUT"

      - name: Use Developer Command Prompt for Microsoft Visual C++
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Configure CMake
        run: cmake --preset "$PRESET"
        env:
          PRESET: ${{ steps.select-preset.outputs.preset }}
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          # CMAKE_C_COMPILER_LAUNCHER: ccache
          # CMAKE_CXX_COMPILER_LAUNCHER: ccache

      - name: Build
        run: cmake --build --preset "$PRESET"
        env:
          PRESET: ${{ steps.select-preset.outputs.preset }}
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      # - name: Print ccache stats
      #   run: ccache -s

      # ── Package ───────────────────────────────────────────────────────────
      # the runner image only has inno setup 6
      - name: Install Inno Setup 7 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\innosetup.exe"
          $dir = "$env:RUNNER_TEMP\innosetup"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne "0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f") {
            throw "Inno Setup download doesn't match its hash"
          }
          Start-Process $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$dir" -Wait
          & "$dir\ISCC.exe" --version
          $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Prepare Binaries
        id: prep
        run: |
          # Set up variables
          build_dir="bin/${{ matrix.build-type }}"
          config="${{ runner.os }}-${{ matrix.build-type }}-$(echo "${{ runner.arch }}" | tr '[:upper:]' '[:lower:]')"
          bundle_dir="$PWD/bundle"

          # Create bundle directory for all outputs
          mkdir -p "$bundle_dir"
          cd "$build_dir"

          case "${{ runner.os }}" in
            "Windows")
              # the installer picks everything up from the build and ci/out itself
              iscc ../../installer/setup.iss

              cp blur-cli.exe "$bundle_dir/blur-cli-$config.exe"
              cp blur-gui.exe "$bundle_dir/blur-$config.exe"
              cp ../../installer/output/blur-installer.exe "$bundle_dir/blur-Windows-Installer-x64.exe"
              ;;

            "Linux")
              # Package everything
              mkdir -p package
              mv blur-cli "package/blur-cli-$config"
              mv blur "package/blur-$config"

              # preserve angle symlinks
              shopt -s nullglob
              angle_egl_libraries=( *EGL*.so* )
              angle_gles_libraries=( *GLESv2*.so* )
              if (( ${#angle_egl_libraries[@]} == 0 || ${#angle_gles_libraries[@]} == 0 )); then
                echo "Missing ANGLE Linux runtime libraries in $PWD" >&2
                exit 1
              fi
              cp -a -- "${angle_egl_libraries[@]}" "${angle_gles_libraries[@]}" package/

              mv lib/ package/
              cp -r ../../ci/out/* package/

              linux_gui="package/blur-$config"
              # shellcheck disable=SC2016 # looking for a literal $ORIGIN
              if ! readelf -d "$linux_gui" | grep -Fq '$ORIGIN'; then
                echo "Linux GUI does not have a relocatable \$ORIGIN RUNPATH" >&2
                readelf -d "$linux_gui" >&2
                exit 1
              fi

              elf_files=( "$linux_gui" package/*EGL*.so* package/*GLESv2*.so* )
              for elf_file in "${elf_files[@]}"; do
                missing_dependencies="$(ldd "$elf_file" | grep 'not found' || true)"
                if [[ -n "$missing_dependencies" ]]; then
                  echo "Unresolved runtime dependencies for $elf_file:" >&2
                  echo "$missing_dependencies" >&2
                  exit 1
                fi
              done

              tar -czf "$bundle_dir/blur-$config.tar.gz" -C package .
              ;;

            "macOS")
              # Package CLI
              mv blur-cli "blur-cli-$config"
              tar -czf "$bundle_dir/blur-cli-$config.tar.gz" "blur-cli-$config"

              # Create DMG
              brew install create-dmg
              mkdir source_folder && mv blur.app source_folder/
              create-dmg \
                --volname "Blur Installer" \
                --window-pos 200 120 \
                --window-size 600 400 \
                --icon-size 100 \
                --icon "blur.app" 175 120 \
                --hide-extension "blur.app" \
                --app-drop-link 425 120 \
                "$bundle_dir/blur-$config.dmg" source_folder
              ;;
          esac

          # Set outputs
          echo "config=$config" >> "$GITHUB_OUTPUT"

      - name: Upload Artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Blur-${{ steps.prep.outputs.config }}
          path: bundle/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: Blur-*
          path: bundle/
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes ""
          fi
          gh release upload "$TAG" bundle/* --clobber
