name: "Verify version"

on:
  release:
    types: [published]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Check versions are semver and match tag
        run: |
          VERSION=$(awk '/^project\(/,/\)/' CMakeLists.txt | sed -n 's/^[[:space:]]*VERSION[[:space:]]\+\([^[:space:])]*\).*$/\1/p' | head -1)
          TAG="${GITHUB_REF#refs/tags/v}"

          # check that it's digits only
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "project version '$VERSION' isn't semver (MAJOR.MINOR.PATCH)"
            exit 1
          fi

          if [[ "$VERSION" != "$TAG" ]]; then
            echo "project version '$VERSION' doesn't match release tag $GITHUB_REF"
            exit 1
          fi
