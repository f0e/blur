name: "Verify BLUR_VERSION"

on:
  release:
    types: [published]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check versions are semver and match tag
        run: |
          VERSION=$(sed -n 's/^const std::string BLUR_VERSION = "\(.*\)";$/\1/p' src/common/blur.h)
          TAG="${GITHUB_REF#refs/tags/v}"

          # check that it's digits only
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "BLUR_VERSION '$VERSION' isn't semver (MAJOR.MINOR.PATCH)"
            exit 1
          fi

          if [[ "$VERSION" != "$TAG" ]]; then
            echo "BLUR_VERSION '$VERSION' doesn't match release tag $GITHUB_REF"
            exit 1
          fi
